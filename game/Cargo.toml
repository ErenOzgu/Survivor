[package]
name = "rnsurvivors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rnsurvivors: a survivors-style game in the WoW 1.12 world, on the benilla engine"

[dependencies]
benilla-world.workspace = true
benilla-assets.workspace = true
benilla-formats.workspace = true
bevy.workspace = true
avian3d.workspace = true
# Sound playback (WoW's own WAV/MP3 files from the player's MPQs); the version Bevy's lock carries.
rodio = { version = "0.20", default-features = false, features = ["symphonia-wav", "symphonia-mp3"] }
anyhow = "1"

[[bin]]
name = "rnsurvivors"
path = "src/main.rs"
